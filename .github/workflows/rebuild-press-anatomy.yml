name: Rebuild Press plano anatomy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-press-anatomy.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild WebP from verified chunks
        run: |
          cat assets/anatomy/day1/.press-part1.txt \
              assets/anatomy/day1/.press-part2.txt \
              assets/anatomy/day1/.press-part3.txt \
              assets/anatomy/day1/.press-part4.txt \
            | tr -d '\\n\\r ' | base64 -d > assets/anatomy/day1/press-plano-target.webp
      - name: Validate image
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('assets/anatomy/day1/press-plano-target.webp')
          im=Image.open(p)
          im.load()
          print('FORMAT=', im.format)
          print('SIZE=', im.size)
          print('BYTES=', p.stat().st_size)
          assert im.format == 'WEBP'
          assert im.size == (640,672)
          assert p.stat().st_size > 20000
          PY
      - name: Commit valid image
        run: |
          rm assets/anatomy/day1/.press-part1.txt assets/anatomy/day1/.press-part2.txt assets/anatomy/day1/.press-part3.txt assets/anatomy/day1/.press-part4.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reemplazar anatomía Press plano por imagen válida'
          git pull --rebase origin main
          git push origin HEAD:main
