name: Deploy GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test live React site
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -e
          curl -H 'Cache-Control: no-cache' -fL --retry 8 --retry-delay 3 "$SITE" -o /tmp/index.html
          grep -q 'id="root"' /tmp/index.html
          SCRIPT=$(grep -oE '<script type="module"[^>]+src="[^"]+\.js"' /tmp/index.html | head -1 | sed -E 's/.*src="([^"]+)".*/\1/')
          test -n "$SCRIPT"
          case "$SCRIPT" in
            http*) SCRIPT_URL="$SCRIPT" ;;
            /*) ORIGIN=$(printf '%s' "$SITE" | sed -E 's#(https?://[^/]+).*#\1#'); SCRIPT_URL="$ORIGIN$SCRIPT" ;;
            *) SCRIPT_URL="$SITE$SCRIPT" ;;
          esac
          curl -H 'Cache-Control: no-cache' -fL --retry 5 "$SCRIPT_URL" -o /tmp/app.js
          test $(wc -c < /tmp/app.js) -gt 50000
          curl -H 'Cache-Control: no-cache' -fL --retry 5 "${SITE}assets/anatomy/day1/press-plano-body.webp" -o /tmp/press.webp
          test "$(head -c 4 /tmp/press.webp)" = "RIFF"
