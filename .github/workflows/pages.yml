name: Deploy GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Restore Vite entry
        run: cp react-index.html index.html
      - name: Build React app
        run: npm run build
      - name: Add existing static assets
        run: |
          mkdir -p dist/assets
          cp -r assets/. dist/assets/
          cp manifest.webmanifest dist/manifest.webmanifest
          cp sw.js dist/sw.js
          cp .nojekyll dist/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload production build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test deployed React app
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -e
          curl -H 'Cache-Control: no-cache' -fL --retry 8 --retry-delay 3 "$SITE" -o /tmp/index.html
          grep -q 'id="root"' /tmp/index.html
          SCRIPT=$(grep -oE '<script type="module"[^>]+src="[^"]+\.js"' /tmp/index.html | head -1 | sed -E 's/.*src="([^"]+)".*/\1/')
          test -n "$SCRIPT"
          case "$SCRIPT" in
            http*) SCRIPT_URL="$SCRIPT" ;;
            /*) BASE=$(printf '%s' "$SITE" | sed 's#/$##'); ORIGIN=$(printf '%s' "$BASE" | sed -E 's#(https?://[^/]+).*#\1#'); SCRIPT_URL="$ORIGIN$SCRIPT" ;;
            *) SCRIPT_URL="$SITE$SCRIPT" ;;
          esac
          curl -H 'Cache-Control: no-cache' -fL --retry 5 "$SCRIPT_URL" -o /tmp/app.js
          test $(wc -c < /tmp/app.js) -gt 50000
          curl -H 'Cache-Control: no-cache' -fL --retry 5 "${SITE}assets/anatomy/day1/press-plano-body.webp" -o /tmp/press.webp
          test "$(head -c 4 /tmp/press.webp)" = "RIFF"
