name: React migration CI
on:
  push:
    branches: [react-transition-qa]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: react-transition-qa-ci
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Include existing static assets in production artifact
        run: |
          mkdir -p dist/assets
          cp -r assets/. dist/assets/
          cp manifest.webmanifest dist/manifest.webmanifest
          cp sw.js dist/sw.js
          cp .nojekyll dist/.nojekyll
      - run: npm run test:e2e
      - name: Prepare static React release branch
        if: success()
        run: |
          set -e
          rm -rf /tmp/react-release
          mkdir -p /tmp/react-release
          cp -a dist/. /tmp/react-release/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B react-release-static origin/main
          git reset --hard origin/main
          git clean -fdx
          cp -a /tmp/react-release/. .
          rm -rf node_modules dist
          git add -A
          if git diff --cached --quiet; then
            echo "Static release already up to date"
          else
            git commit -m "Preparar release React validado"
          fi
          git push --force origin HEAD:react-release-static
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: react-build-and-qa
          path: |
            dist
            playwright-report
            test-results
          if-no-files-found: ignore
