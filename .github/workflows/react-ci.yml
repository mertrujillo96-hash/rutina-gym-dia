name: React migration CI
on:
  push:
    branches: [react-transition-qa]
  workflow_dispatch:
concurrency:
  group: react-transition-qa-ci
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Include existing static assets in production artifact
        run: |
          mkdir -p dist/assets
          cp -r assets/. dist/assets/
          cp manifest.webmanifest dist/manifest.webmanifest
          cp sw.js dist/sw.js
          cp .nojekyll dist/.nojekyll
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: react-build-and-qa
          path: |
            dist
            playwright-report
            test-results
          if-no-files-found: ignore
