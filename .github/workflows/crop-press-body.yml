name: Crop Press plano body
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crop-press-body.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Crop anatomy body panel
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path('assets/anatomy/day1/press-plano-target.webp')
          out=Path('assets/anatomy/day1/press-plano-body.webp')
          im=Image.open(src).convert('RGB')
          assert im.size == (640,672), im.size
          # Keep only the anatomical figures and their muscle callouts.
          crop=im.crop((20,78,445,560))
          crop.save(out,'WEBP',quality=92,method=6)
          test=Image.open(out); test.load()
          print('FORMAT=',test.format)
          print('SIZE=',test.size)
          print('BYTES=',out.stat().st_size)
          assert test.format=='WEBP'
          assert test.size==(425,482)
          assert out.stat().st_size>12000
          PY
      - name: Commit cropped asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/anatomy/day1/press-plano-body.webp
          git commit -m 'Agregar anatomía recortada de Press plano' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
