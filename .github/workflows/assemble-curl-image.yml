name: Assemble Curl barra anatomy image

on:
  push:
    branches: ["main"]
    paths:
      - ".tmp/curl/**"
      - ".github/workflows/assemble-curl-image.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assemble-curl-image
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild generated WebP
        run: |
          set -euo pipefail
          mkdir -p assets/anatomy/day1
          cat .tmp/curl/chunk*.txt | tr -d '\n\r ' | base64 -d > assets/anatomy/day1/curl-barra-anatomy-generated-v2.webp
          test "$(head -c 4 assets/anatomy/day1/curl-barra-anatomy-generated-v2.webp)" = "RIFF"
          file assets/anatomy/day1/curl-barra-anatomy-generated-v2.webp
          test $(wc -c < assets/anatomy/day1/curl-barra-anatomy-generated-v2.webp) -gt 30000
      - name: Commit rebuilt asset
        run: |
          set -euo pipefail
          rm -rf .tmp/curl
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/anatomy/day1/curl-barra-anatomy-generated-v2.webp .tmp/curl
          if ! git diff --cached --quiet; then
            git commit -m 'Reconstruir imagen anatómica Curl barra v2'
            git push origin HEAD:main
          fi
