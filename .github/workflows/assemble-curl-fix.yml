name: Assemble exact Curl barra anatomy

on:
  push:
    branches: ["main"]
    paths:
      - ".tmp/curlfix/**"
      - ".github/workflows/assemble-curl-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assemble-curl-fix
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact WebP
        run: |
          set -euo pipefail
          mkdir -p assets/anatomy/day1
          cat .tmp/curlfix/chunk*.txt | tr -d '\n\r ' | base64 -d > assets/anatomy/day1/curl-barra-anatomy-final.webp
          echo "e05717f7f578ddcc3bdfd054bf5a3cd46297169d739e21cf3eb975b9820360c2  assets/anatomy/day1/curl-barra-anatomy-final.webp" | sha256sum -c -
          test "$(wc -c < assets/anatomy/day1/curl-barra-anatomy-final.webp)" -eq 16474
          file assets/anatomy/day1/curl-barra-anatomy-final.webp
          test "$(head -c 4 assets/anatomy/day1/curl-barra-anatomy-final.webp)" = "RIFF"

      - name: Commit exact asset
        run: |
          set -euo pipefail
          rm -rf .tmp/curlfix
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/anatomy/day1/curl-barra-anatomy-final.webp .tmp/curlfix
          if ! git diff --cached --quiet; then
            git commit -m 'Publicar anatomía exacta de Curl barra'
            git push origin HEAD:main
          fi
