name: Install Pec deck anatomy crop
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-image-assets.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact crop
        env:
          IMG: 'https://media.canva.com/v2/image-resize/format:PNG/height:315/quality:100/uri:ifs%3A%2F%2FM%2F4fc9b589-6bfb-4d1f-aaea-70ea72f8493e/watermark:F/width:470?csig=AAAAAAAAAAAAAAAAAAAAAOGv3b6Wj8BFQaNWjwG2MhrBvZvEhmFmK2wCb5Q7Qvi8&exp=1791392381&osig=AAAAAAAAAAAAAAAAAAAAAJJVs1jbYdtsuZsZ-MeWBcqoeQb3q0ZLoJVSZgF6NIP6&signer=media-rpc&token=AAIAAU0AJDRmYzliNTg5LTZiZmItNGQxZi1hYWVhLTcwZWE3MmY4NDkzZQAAAAABoRdOeEgIsMk2j6Z50SJKFWeo4KXNiQuC3J-e46ZWYI8TxDgeNQ&x-canva-quality=thumbnail'
        run: |
          mkdir -p assets/anatomy
          curl --fail --location "$IMG" -o assets/anatomy/pec-deck.png
          test $(wc -c < assets/anatomy/pec-deck.png) -gt 10000
      - name: Commit crop
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/anatomy/pec-deck.png
          git commit -m 'Agregar recorte anatómico Pec deck' || exit 0
          git push origin HEAD:main
